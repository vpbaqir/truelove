<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeatShuffle</title><style>body{font:16px system-ui;background:#f2f2fa;color:#28253e;max-width:820px;margin:auto;padding:24px}h1{font-size:42px;letter-spacing:-2px}.panel{background:#fff;border:1px solid #e1e0ef;border-radius:18px;padding:20px}textarea,input,button{font:inherit;border-radius:9px;border:1px solid #dcd9ed;padding:11px}textarea{width:100%;box-sizing:border-box;min-height:125px}button{background:#5544a0;color:white;border:0;cursor:pointer;margin:6px 5px 6px 0}.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-top:15px}.seat{background:#f0effb;padding:15px;border-radius:10px;text-align:center}.muted{font-size:13px;color:#77748f}</style><body><p class="muted">CLASSROOM HELPER</p><h1>SeatShuffle</h1><p>Randomise seating fairly, with an optional fixed seat count.</p><section class="panel"><label for="names">Student names — one per line</label><textarea id="names" placeholder="Amina&#10;Bilal&#10;Sara&#10;Yusuf">Amina
Bilal
Sara
Yusuf</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><label>Columns <input id="cols" type="number" min="1" max="8" value="4" style="width:65px"></label><button id="shuffle">Shuffle seats</button><button id="export">Export seating CSV</button></div><p class="muted" id="status">Enter names to begin.</p><div id="seats" class="seats"></div></section><p class="muted">Random shuffle is not cryptographic and does not guarantee long-term fairness.</p><script>let assigned=[];const $=id=>document.getElementById(id);$("shuffle").onclick=()=>{let names=$("names").value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!names.length){$("status").textContent="Add at least one name.";return}if(new Set(names).size!==names.length){$("status").textContent="Duplicate names found. They are kept as separate entries."}for(let i=names.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]]}assigned=names;$("seats").style.gridTemplateColumns="repeat("+Math.max(1,Math.min(8,+$("cols").value||4))+",minmax(0,1fr))";$("seats").innerHTML=names.map((n,i)=>'<div class="seat"><div class="muted">SEAT '+(i+1)+'</div><b>'+esc(n)+'</b></div>').join("");$("status").textContent=names.length+" seats assigned."};function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}$("export").onclick=()=>{if(!assigned.length)return $("status").textContent="Shuffle first, then export.";let csv="Seat,Name\n"+assigned.map((n,i)=>(i+1)+',"'+n.replace(/"/g,'""')+'"').join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="seating.csv";a.click();URL.revokeObjectURL(a.href)};$("shuffle").click();</script></body></html>
