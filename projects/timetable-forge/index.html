<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timetable Forge</title><style>body{font:16px system-ui;margin:auto;max-width:950px;padding:24px;background:#f4f5ef;color:#20291f}h1{letter-spacing:-1.5px}main{background:white;border:1px solid #e2e5dc;border-radius:18px;padding:20px}input,select,button{font:inherit;padding:10px;border:1px solid #d6dccf;border-radius:9px}button{cursor:pointer;background:#28432e;color:white;border:0}.form{display:flex;gap:8px;flex-wrap:wrap}.form input{flex:1;min-width:140px}.grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;overflow:auto;margin-top:16px}.day{background:#f5f7f1;border-radius:12px;padding:10px;min-height:180px}.slot{background:#dfeadb;padding:9px;border-radius:8px;margin:7px 0;font-size:13px}.muted{color:#6b7567;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:repeat(5,150px)}} </style><body><p class="muted">STUDENT TOOLKIT / 01</p><h1>Timetable Forge</h1><p>Build a weekly class plan that fits your real schedule.</p><main><form id="form" class="form"><input id="subject" required placeholder="Subject or activity"><select id="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><input id="time" type="time" required value="09:00"><button>Add slot</button></form><div class="controls" style="margin-top:12px"><button type="button" id="export">Export JSON backup</button> <button type="button" id="clear" style="background:#e8eee4;color:#28432e">Clear week</button></div><div class="grid" id="grid"></div><p class="muted">Saved in this browser only. Export a backup before clearing browser data.</p></main><script>const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];let slots=[];const $=id=>document.getElementById(id);function draw(){$("grid").innerHTML=days.map(d=>'<section class="day"><b>'+d+'</b>'+slots.filter(s=>s.day===d).sort((a,b)=>a.time.localeCompare(b.time)).map(s=>'<div class="slot"><b>'+s.time+'</b><br>'+s.subject+' <button data-id="'+s.id+'" style="float:right;padding:2px 6px;background:#fff;color:#333" aria-label="Remove '+s.subject+'">×</button></div>').join("")+'</section>').join("");$("grid").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{slots=slots.filter(s=>s.id!==b.dataset.id);draw()})}$("form").onsubmit=e=>{e.preventDefault();slots.push({id:crypto.randomUUID(),subject:$("subject").value.trim(),day:$("day").value,time:$("time").value});$("subject").value="";draw()};$("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(slots,null,2)],{type:"application/json"}));a.download="timetable.json";a.click();URL.revokeObjectURL(a.href)};$("clear").onclick=()=>{if(confirm("Clear the timetable?")){slots=[];draw()}};draw();</script></body></html>
