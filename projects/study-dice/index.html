<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Dice</title><style>body{font:16px system-ui;background:#f4f1ff;color:#332c54;max-width:760px;margin:auto;padding:24px}h1{font-size:42px;letter-spacing:-2px}.panel{background:white;border:1px solid #e2dcf4;border-radius:18px;padding:24px;text-align:center}.dice{font-size:72px;margin:20px}.prompt{font-size:22px;font-weight:700;min-height:60px}.muted{color:#81799b;font-size:13px}button{background:#57449b;color:white;border:0;border-radius:10px;padding:12px 17px;font:inherit;cursor:pointer}.list{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0}.tag{background:#f0edfb;border-radius:99px;padding:7px 11px}</style><body><p class="muted">BREAK THE STUDY LOOP</p><h1>Study Dice</h1><p>Roll for a small study action when you don't know where to begin.</p><section class="panel"><div class="muted">YOUR NEXT MICRO-TASK</div><div id="dice" class="dice">⚄</div><div id="prompt" class="prompt">Ready to roll?</div><p id="why" class="muted">A small next step beats waiting for motivation.</p><button id="roll">Roll study dice</button><div class="list"><span class="tag">2 min</span><span class="tag">No setup</span><span class="tag">Any subject</span></div></section><section class="panel" style="margin-top:12px;text-align:left"><b>Custom actions</b><p class="muted">One action per line. Leave blank to use the defaults.</p><textarea id="custom" style="width:100%;box-sizing:border-box;min-height:95px;border:1px solid #ddd5f0;border-radius:9px;padding:10px" placeholder="Review 3 flashcards&#10;Summarise one paragraph"></textarea><button id="save" style="margin-top:8px">Use my actions</button></section><script>const defaults=["Review three flashcards","Write a one-sentence summary","Solve one practice question","Explain a concept out loud","Organise your notes for two minutes","Recall five key terms"];let actions=[...defaults];const $=id=>document.getElementById(id);$("roll").onclick=()=>{let i=crypto.getRandomValues(new Uint32Array(1))[0]%actions.length;$("dice").textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][i%6];$("prompt").textContent=actions[i];$("why").textContent="Start a short timer and stop when the task is done."};$("save").onclick=()=>{let a=$("custom").value.split("\n").map(x=>x.trim()).filter(Boolean);actions=a.length?a:defaults;$("why").textContent=actions.length+" study actions ready. Roll to choose one."};</script></body></html>
