<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Atlas</title><style>body{font:16px system-ui;background:#f2f5f8;color:#263545;max-width:850px;margin:auto;padding:24px}h1{font-size:42px;letter-spacing:-2px}.panel{background:white;border:1px solid #dce4ec;border-radius:18px;padding:20px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border:1px solid #d6e0e8;border-radius:9px}input{flex:1;min-width:110px}button{background:#305777;color:white;border:0;cursor:pointer}.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e7edf2}.muted{font-size:13px;color:#718090}</style><body><p class="muted">HOME & WORKSPACE ORGANISER</p><h1>Inventory Atlas</h1><p>Track what you own, where it is, and what may need replacing.</p><section class="panel"><form id="form" class="row"><input id="name" required placeholder="Item name"><input id="location" placeholder="Location (e.g. shelf A)"><input id="qty" type="number" min="1" value="1" style="max-width:90px"><button>Add item</button></form><div class="row" style="margin-top:12px"><input id="search" placeholder="Search inventory"><button type="button" id="export">Export CSV</button></div></section><section class="panel"><div id="items"></div><p id="empty" class="muted">Your inventory is empty. Add an item above.</p></section><p class="muted">This prototype keeps data in memory only; export to retain a copy.</p><script>let items=[];const $=id=>document.getElementById(id);function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function draw(){let a=items.filter(x=>(x.name+" "+x.location).toLowerCase().includes($("search").value.toLowerCase()));$("empty").hidden=a.length>0;$("items").innerHTML=a.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.location||"Location not set")+'</div></div><span>× '+x.qty+'</span><button data-id="'+x.id+'" style="padding:6px 9px">Remove</button></div>').join("");$("items").querySelectorAll("button").forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.id);draw()})}$("form").onsubmit=e=>{e.preventDefault();items.push({id:crypto.randomUUID(),name:$("name").value.trim(),location:$("location").value.trim(),qty:Math.max(1,+$("qty").value||1)});$("name").value="";draw()};$("search").oninput=draw;$("export").onclick=()=>{let csv="Item,Location,Quantity\n"+items.map(x=>'"'+x.name.replace(/"/g,'""')+'","'+x.location.replace(/"/g,'""')+'",'+x.qty).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="inventory.csv";a.click();URL.revokeObjectURL(a.href)};draw();</script></body></html>
