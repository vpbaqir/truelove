<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1effb"><title>Readwell</title>
<style>
:root{--bg:#f1effb;--paper:#fff;--ink:#282541;--muted:#77748f;--line:#e3e0f1;--purple:#6556b8;--soft:#eeebff;--green:#dff4e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px 16px 40px}header{display:flex;align-items:center;gap:12px;margin-bottom:23px}.mark{width:45px;height:45px;border-radius:15px;background:var(--purple);color:white;display:grid;place-items:center;font-size:22px}h1{margin:0;font-size:25px;letter-spacing:-.05em}header p,.muted{margin:2px 0;color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:end;gap:15px;background:linear-gradient(120deg,#e5e0ff,#faf5ff);padding:22px;border-radius:21px;margin-bottom:14px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--purple)}.hero h2{font-size:clamp(26px,5vw,36px);letter-spacing:-.05em;line-height:1.1;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;letter-spacing:-.04em}.layout{display:grid;grid-template-columns:300px 1fr;gap:13px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:800}.field input,.field select{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:white;color:var(--ink)}.btn{border:0;border-radius:10px;padding:10px 12px;background:var(--purple);color:white;font-weight:800;cursor:pointer}.btn.light{background:white;color:var(--ink);border:1px solid var(--line)}.actions{display:flex;gap:7px;flex-wrap:wrap}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.filter{border:1px solid var(--line);border-radius:999px;background:white;padding:7px 10px;font-size:12px;cursor:pointer}.filter.active{background:var(--soft);border-color:#c9c1ff;color:var(--purple);font-weight:800}.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.book{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.book h3{margin:0;font-size:16px;overflow-wrap:anywhere}.book p{margin:3px 0 10px;color:var(--muted);font-size:12px}.bar{height:7px;border-radius:999px;background:#eeedf4;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:var(--purple);border-radius:999px}.book input{width:90px;border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}.bookfoot{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:12px;color:var(--muted)}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:13px;padding:24px;text-align:center;color:var(--muted)}.status{font-size:12px;color:var(--muted);min-height:20px;margin-top:7px}@media(max-width:780px){.layout{grid-template-columns:1fr}.books{grid-template-columns:1fr}.hero{display:block}}@media(max-width:460px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}}
</style></head><body><main class="wrap"><header><div class="mark" aria-hidden="true">▤</div><div><h1>Readwell</h1><p>A calm shelf for books you want to finish.</p></div></header><section class="hero"><div><div class="eyebrow">Reading tracker</div><h2>Read a little.<br>Remember more.</h2><p class="muted">Keep your shelf, page progress, and next book in one place.</p></div></section><section class="stats"><div class="stat"><small>On your shelf</small><strong id="total">0</strong></div><div class="stat"><small>In progress</small><strong id="reading">0</strong></div><div class="stat"><small>Pages read</small><strong id="pages">0</strong></div></section><div class="layout"><section class="panel"><h2 style="font-size:16px;margin:0 0 12px">Add a book</h2><form id="form"><div class="field"><label for="title">Book title</label><input id="title" required maxlength="120" placeholder="e.g. Deep Work"></div><div class="field"><label for="author">Author (optional)</label><input id="author" maxlength="100" placeholder="Author name"></div><div class="field"><label for="totalPages">Total pages</label><input id="totalPages" type="number" min="1" max="100000" value="200" required></div><button class="btn" type="submit">＋ Add to shelf</button></form><div id="status" class="status" role="status" aria-live="polite"></div><div class="actions" style="margin-top:12px"><button class="btn light" id="export" type="button">Export JSON</button><button class="btn light" id="import" type="button">Import JSON</button><input id="file" type="file" accept="application/json,.json" hidden></div><p class="muted" style="font-size:12px;margin-top:12px">Your shelf stays in this browser. Export a backup before changing devices.</p></section><section class="panel"><div class="filters" id="filters"><button class="filter active" data-filter="all">All books</button><button class="filter" data-filter="reading">Reading</button><button class="filter" data-filter="done">Finished</button></div><div id="books" class="books"></div></section></div></main>
<script>
const $=id=>document.getElementById(id),key="readwell-books-v1";let books=[];try{books=JSON.parse(localStorage.getItem(key)||"[]");if(!Array.isArray(books))books=[]}catch(e){books=[]}let filter="all";
function save(){try{localStorage.setItem(key,JSON.stringify(books))}catch(e){$("status").textContent="Local storage is unavailable. Export your shelf as a backup."}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const shown=books.filter(b=>filter==="all"||(filter==="done"?b.current>=b.total:b.current<b.total));$("total").textContent=books.length;$("reading").textContent=books.filter(b=>b.current<b.total).length;$("pages").textContent=books.reduce((n,b)=>n+Number(b.current||0),0);const root=$("books");root.innerHTML="";if(!shown.length){const e=document.createElement("div");e.className="empty";e.textContent=books.length?"No books in this filter yet. Add progress to move a book here.":"Your shelf is empty. Add the first book to begin.";root.append(e);return}shown.forEach(b=>{const pct=Math.min(100,Math.round(b.current/b.total*100));const card=document.createElement("article");card.className="book";card.innerHTML='<h3>'+esc(b.title)+'</h3><p>'+esc(b.author||"Author not added")+'</p><div class="bar" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="'+b.total+'" aria-valuenow="'+b.current+'"><span style="width:'+pct+'%"></span></div><div class="bookfoot"><span>'+b.current+' / '+b.total+' pages · '+pct+'%</span><span>'+(pct===100?"Finished":"In progress")+'</span></div><div style="display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap"><label style="font-size:11px" for="page-'+b.id+'">Current page</label><input id="page-'+b.id+'" type="number" min="0" max="'+b.total+'" value="'+b.current+'"><button class="btn" data-act="save" data-id="'+b.id+'">Save</button><button class="btn light" data-act="delete" data-id="'+b.id+'">Delete</button></div>';root.append(card)})}
$("form").addEventListener("submit",e=>{e.preventDefault();const title=$("title").value.trim(),total=Number($("totalPages").value);if(!title||!Number.isInteger(total)||total<1){$("status").textContent="Enter a title and a positive whole number of pages.";return}books.unshift({id:Date.now()+Math.random(),title,author:$("author").value.trim(),total,current:0});save();render();$("form").reset();$("totalPages").value=200;$("status").textContent="Book added to your shelf."});
$("books").addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const item=books.find(x=>String(x.id)===b.dataset.id);if(!item)return;if(b.dataset.act==="delete"){books=books.filter(x=>x!==item);$("status").textContent="Book removed."}else{const n=Number($("page-"+item.id).value);if(!Number.isInteger(n)||n<0||n>item.total){$("status").textContent="Page must be between 0 and "+item.total+".";return}item.current=n;$("status").textContent="Progress saved."}save();render()});
$("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
$("export").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:"application/json"}));a.download="readwell-shelf.json";a.click();URL.revokeObjectURL(a.href)});
$("import").addEventListener("click",()=>$("file").click());$("file").addEventListener("change",async()=>{const f=$("file").files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||data.some(b=>typeof b.title!=="string"||!Number.isFinite(Number(b.total))||!Number.isFinite(Number(b.current))))throw Error("Invalid book list");books=data.map(b=>({id:b.id||Date.now()+Math.random(),title:b.title.slice(0,120),author:String(b.author||"").slice(0,100),total:Math.max(1,Number(b.total)),current:Math.max(0,Math.min(Number(b.total),Number(b.current)))}));save();render();$("status").textContent="Shelf imported."}catch(e){$("status").textContent="Import failed: choose a valid Readwell JSON backup."}$("file").value=""});render();
</script></body></html>
