<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizBell</title><style>body{font:16px system-ui;background:#fff5e9;color:#49301c;max-width:780px;margin:auto;padding:24px}h1{font-size:42px;letter-spacing:-2px}.panel{background:white;border:1px solid #f0dfc9;border-radius:18px;padding:22px}.question{font-size:23px;font-weight:700;margin:20px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answers button{padding:13px;background:#fff9f1;border:1px solid #ead9c3;border-radius:10px;text-align:left;color:#49301c;cursor:pointer}.answers button:focus,.answers button:hover{background:#f8e4c9}.muted{font-size:13px;color:#927e6a}.primary{background:#79451f;color:white;padding:10px 14px;border:0;border-radius:9px;cursor:pointer;margin-top:12px}@media(max-width:500px){.answers{grid-template-columns:1fr}}</style><body><p class="muted">QUICK CLASSROOM QUIZ</p><h1>QuizBell</h1><p>Run a short multiple-choice round or use it to practise alone.</p><section class="panel"><div class="muted" id="progress">QUESTION 1</div><div id="question" class="question"></div><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button class="primary" id="next" hidden>Next question →</button><p class="muted" id="score">Score: 0</p></section><script>const qs=[{q:"Which planet is known as the Red Planet?",a:["Venus","Mars","Jupiter","Mercury"],c:1},{q:"What is 9 × 7?",a:["56","63","72","69"],c:1},{q:"Which gas do plants absorb?",a:["Oxygen","Helium","Carbon dioxide","Hydrogen"],c:2},{q:"How many sides does a hexagon have?",a:["Five","Six","Seven","Eight"],c:1},{q:"What is the largest ocean?",a:["Atlantic","Indian","Arctic","Pacific"],c:3}];let order=[...qs].sort(()=>Math.random()-.5),i=0,score=0,answered=false;const $=id=>document.getElementById(id);function draw(){answered=false;$("progress").textContent="QUESTION "+(i+1)+" OF "+order.length;$("question").textContent=order[i].q;$("answers").innerHTML=order[i].a.map((a,j)=>'<button data-j="'+j+'">'+a+'</button>').join("");$("answers").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let ok=+b.dataset.j===order[i].c;if(ok)score++;$("feedback").textContent=ok?"Correct!":"Not quite. Answer: "+order[i].a[order[i].c];$("score").textContent="Score: "+score;$("next").hidden=false});$("next").hidden=true;$("feedback").textContent=""} $("next").onclick=()=>{if(++i>=order.length){$("question").textContent="Round complete";$("answers").innerHTML="";$("feedback").textContent="Final score: "+score+" / "+order.length;$("next").textContent="Play again";$("next").onclick=()=>{i=0;score=0;order=[...qs].sort(()=>Math.random()-.5);$("next").textContent="Next question →";$("next").onclick=next;draw()};return}draw()};function next(){if(++i>=order.length){$("question").textContent="Round complete";$("answers").innerHTML="";$("feedback").textContent="Final score: "+score+" / "+order.length;$("next").textContent="Play again";$("next").onclick=()=>{i=0;score=0;order=[...qs].sort(()=>Math.random()-.5);$("next").textContent="Next question →";$("next").onclick=next;draw()};return}draw()}draw();</script></body></html>
