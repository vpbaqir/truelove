<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripTide</title><style>body{font:16px system-ui;background:#eff6f5;color:#183b3a;margin:auto;max-width:850px;padding:24px}h1{font-size:42px;letter-spacing:-2px}.card{background:white;border:1px solid #dce9e5;border-radius:18px;padding:18px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:10px;border:1px solid #d0e0da;border-radius:9px;font:inherit}input{flex:1;min-width:130px}button{background:#17645b;color:white;border:0;cursor:pointer}.stop{padding:12px 0;border-bottom:1px solid #e5eeea}.muted{color:#69807a;font-size:13px}</style><body><p class="muted">TRAVEL PLANNING, WITHOUT THE SPREADSHEETS</p><h1>TripTide<span style="color:#4b9a89">.</span></h1><p>Build a flexible itinerary and keep the important details together.</p><section class="card"><form id="form" class="row"><input id="place" required placeholder="Stop or activity"><input id="date" type="date" aria-label="Trip date"><input id="cost" type="number" min="0" step=".01" placeholder="Budget ₹"><button>Add stop</button></form><div class="row" style="margin-top:12px"><button type="button" id="export">Export itinerary</button><span class="muted" id="total" style="align-self:center"></span></div></section><section class="card"><h2>Your route</h2><div id="list"><p class="muted">No stops yet. Add the first place above.</p></div></section><p class="muted">Planning tool only: it does not fetch maps, routes, transport times, or live prices.</p><script>let stops=[];const $=id=>document.getElementById(id);function draw(){$("list").innerHTML=stops.length?stops.map((s,i)=>'<div class="stop"><b>'+(i+1)+'. '+esc(s.place)+'</b><div class="muted">'+(s.date||"Date not set")+' · ₹'+s.cost.toLocaleString("en-IN")+'</div><button data-id="'+s.id+'" style="margin-top:6px;padding:5px 9px">Remove</button></div>').join(""):'<p class="muted">No stops yet. Add the first place above.</p>';$("total").textContent="Planned budget: ₹"+stops.reduce((n,s)=>n+s.cost,0).toLocaleString("en-IN");$("list").querySelectorAll("button").forEach(b=>b.onclick=()=>{stops=stops.filter(s=>s.id!==b.dataset.id);draw()})}function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}$("form").onsubmit=e=>{e.preventDefault();stops.push({id:crypto.randomUUID(),place:$("place").value.trim(),date:$("date").value,cost:+$("cost").value||0});$("place").value="";$("cost").value="";draw()};$("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(stops,null,2)],{type:"application/json"}));a.download="triptide-itinerary.json";a.click();URL.revokeObjectURL(a.href)};draw();</script></body></html>
