<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Minutes — Clear follow-through</title><style>
:root{--bg:#f6f4f0;--paper:#fff;--ink:#252b31;--muted:#7a8188;--line:#e7e4dd;--orange:#b65d35;--green:#2a765a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 16px}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:44px;height:44px;border-radius:14px;background:var(--orange);color:white;display:grid;place-items:center;font-size:22px}h1{font-size:25px;letter-spacing:-.04em;margin:0}p{color:var(--muted);margin:3px 0}.hero{padding:22px;border-radius:20px;background:linear-gradient(120deg,#f6dfd1,#f7f0e5);margin-bottom:14px}.hero h2{font-size:clamp(24px,4vw,34px);letter-spacing:-.05em;margin:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:13px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}h3{font-size:17px;margin:0 0 12px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:12px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.field textarea{min-height:130px;resize:vertical}button{font:inherit;cursor:pointer}.primary,.ghost{border-radius:10px;padding:10px 12px;font-weight:800}.primary{background:var(--orange);color:white;border:0;width:100%}.ghost{background:white;color:var(--muted);border:1px solid var(--line)}.task{display:flex;gap:9px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.task label{flex:1;font-size:13px}.task small{display:block;color:var(--muted);font-size:11px}.task.done label{text-decoration:line-through;color:var(--muted)}.remove{border:0;background:transparent;color:#b44b4b}.status{min-height:20px;font-size:12px;color:var(--green)}.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}@media(max-width:700px){.wrap{padding:15px 11px}.layout{grid-template-columns:1fr}.panel{padding:13px}}
</style></head><body><main class="wrap"><header><div class="logo">✎</div><div><h1>Meeting Minutes</h1><p>Turn a conversation into clear next steps.</p></div></header><section class="hero"><h2>Good meetings leave a trail.</h2><p>Capture key points, assign owners, and keep actions visible.</p></section><div class="layout"><section class="panel"><h3>Notes</h3><div class="field"><label for="title">Title</label><input id="title" maxlength="120" placeholder="Project kickoff"></div><div class="field"><label for="date">Date</label><input id="date" type="date"></div><div class="field"><label for="people">Participants</label><input id="people" maxlength="300" placeholder="Names separated by commas"></div><div class="field"><label for="notes">Discussion and decisions</label><textarea id="notes" maxlength="10000" placeholder="Key points, decisions, open questions…"></textarea></div><button class="ghost" id="export">Export Markdown</button> <button class="ghost" id="fresh">New meeting</button><div class="status" id="status" role="status">Ready.</div></section><section class="panel"><h3>Action items <span id="progress" style="color:var(--muted);font-size:12px"></span></h3><form id="form"><div class="field"><label for="task">Action</label><input id="task" maxlength="180" required placeholder="Share the updated draft"></div><div class="field"><label for="owner">Owner</label><input id="owner" maxlength="60" placeholder="Name"></div><div class="field"><label for="due">Due date</label><input id="due" type="date"></div><button class="primary">Add action</button></form><div id="tasks" style="margin-top:10px"></div><button class="ghost" id="clearDone" style="margin-top:12px">Remove completed actions</button></section></div></main><script>
const $=id=>document.getElementById(id),KEY='meeting-minutes-v1';let tasks=[];function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify({title:$('title').value,date:$('date').value,people:$('people').value,notes:$('notes').value,tasks}));$('status').textContent='Saved on this device.'}catch(e){$('status').textContent='Could not save; export your notes.'}}function render(){const n=tasks.filter(t=>t.done).length;$('progress').textContent=n+' / '+tasks.length+' complete';$('tasks').innerHTML=tasks.length?tasks.map(t=>'<div class="task '+(t.done?'done':'')+'"><input type="checkbox" data-toggle="'+t.id+'" '+(t.done?'checked':'')+' aria-label="Complete action"><label>'+esc(t.text)+'<small>'+esc(t.owner||'No owner')+(t.due?' · Due '+esc(t.due):'')+'</small></label><button class="remove" data-del="'+t.id+'" aria-label="Delete action">×</button></div>').join(''):'<div class="empty">No actions yet. Add the next concrete step.</div>'}function id(){return String(Date.now())+Math.random()}['title','date','people','notes'].forEach(k=>$(k).addEventListener('input',save));$('form').addEventListener('submit',e=>{e.preventDefault();tasks.push({id:id(),text:$('task').value.trim(),owner:$('owner').value.trim(),due:$('due').value,done:false});$('task').value='';save();render()});$('tasks').addEventListener('change',e=>{const b=e.target.closest('[data-toggle]');if(!b)return;const t=tasks.find(x=>x.id===b.dataset.toggle);if(t)t.done=b.checked;save();render()});$('tasks').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;tasks=tasks.filter(t=>t.id!==b.dataset.del);save();render()});$('clearDone').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render()});$('fresh').addEventListener('click',()=>{if(confirm('Replace the current notes? Export first if needed.')){['title','date','people','notes'].forEach(k=>$(k).value='');tasks=[];save();render()}});$('export').addEventListener('click',()=>{const md='# '+($('title').value||'Meeting minutes')+'\n\nDate: '+$('date').value+'\n\nParticipants: '+$('people').value+'\n\n## Notes\n'+$('notes').value+'\n\n## Actions\n'+tasks.map(t=>'- ['+(t.done?'x':' ')+'] '+t.text+' — '+(t.owner||'Unassigned')+(t.due?' (due '+t.due+')':'')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='meeting-minutes.md';a.click();URL.revokeObjectURL(a.href);$('status').textContent='Markdown exported.'});try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');['title','date','people','notes'].forEach(k=>$(k).value=d[k]||'');tasks=Array.isArray(d.tasks)?d.tasks:[]}catch(e){}render();
</script></body></html>
