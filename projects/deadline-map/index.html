<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadline Map</title><style>body{font:16px system-ui;background:#f7f2f2;color:#422e35;max-width:850px;margin:auto;padding:24px}h1{font-size:42px;letter-spacing:-2px}.panel{background:#fff;border:1px solid #ecdde1;border-radius:18px;padding:20px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border:1px solid #e5d7dc;border-radius:9px}input{flex:1;min-width:140px}button{background:#874b61;color:white;border:0;cursor:pointer}.item{padding:13px 0;border-bottom:1px solid #f0e5e8;display:flex;justify-content:space-between;gap:10px}.muted{font-size:13px;color:#907985}.soon{color:#b23b3b;font-weight:700}</style><body><p class="muted">DEADLINE CLARITY</p><h1>Deadline Map</h1><p>Collect due dates in one place and sort by what needs attention next.</p><section class="panel"><form id="form" class="row"><input id="title" required placeholder="Assignment, exam, or task"><input id="date" required type="date" aria-label="Due date"><select id="priority"><option>Normal</option><option>High</option><option>Critical</option></select><button>Add deadline</button></form><div class="row" style="margin-top:12px"><select id="filter" aria-label="Filter deadlines"><option value="all">All deadlines</option><option value="open">Not completed</option><option value="done">Completed</option></select><button type="button" id="export">Export JSON</button></div></section><section class="panel"><div id="list"></div><p id="empty" class="muted">No deadlines added.</p></section><script>let items=[];const $=id=>document.getElementById(id);function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function draw(){let a=items.filter(x=>$("filter").value==="all"||($("filter").value==="done"?x.done:!x.done)).sort((x,y)=>x.date.localeCompare(y.date));$("empty").hidden=a.length>0;$("list").innerHTML=a.map(x=>{let diff=Math.ceil((new Date(x.date+"T00:00:00")-new Date(new Date().toDateString()))/86400000);return '<div class="item"><div><b style="'+(diff<=2&&!x.done?'color:#b23b3b':'')+'">'+esc(x.title)+'</b><div class="muted">'+esc(x.date)+' · '+esc(x.priority)+' · '+(x.done?"Completed":diff<0?Math.abs(diff)+" days overdue":diff===0?"Due today":diff+" days left")+'</div></div><div><button data-toggle="'+x.id+'" style="padding:6px 9px">'+(x.done?"Reopen":"Done")+'</button> <button data-del="'+x.id+'" style="padding:6px 9px;background:#eee;color:#543">×</button></div></div>'}).join("");$("list").querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let x=items.find(x=>x.id===b.dataset.toggle);x.done=!x.done;draw()});$("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.del);draw()})}$("form").onsubmit=e=>{e.preventDefault();items.push({id:crypto.randomUUID(),title:$("title").value.trim(),date:$("date").value,priority:$("priority").value,done:false});$("title").value="";draw()};$("filter").onchange=draw;$("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:"application/json"}));a.download="deadlines.json";a.click();URL.revokeObjectURL(a.href)};draw();</script></body></html>
