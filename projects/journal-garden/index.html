<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal Garden</title><style>body{font:16px system-ui;background:#f1f5eb;color:#2d422d;max-width:820px;margin:auto;padding:24px}h1{font-size:42px;letter-spacing:-2px}.panel{background:#fff;border:1px solid #dfe8d8;border-radius:18px;padding:20px;margin:12px 0}textarea,input,button{font:inherit;padding:11px;border:1px solid #d7e1d0;border-radius:9px}textarea{width:100%;box-sizing:border-box;min-height:120px}button{background:#3e6843;color:white;border:0;cursor:pointer}.entry{padding:12px 0;border-bottom:1px solid #e5ece0}.muted{font-size:13px;color:#758572}.row{display:flex;gap:8px;flex-wrap:wrap}</style><body><p class="muted">PRIVATE REFLECTION SPACE</p><h1>Journal Garden</h1><p>Collect small reflections, gratitude notes, and lessons from the day.</p><section class="panel"><form id="form"><label for="date">Date</label><input id="date" type="date" required><label for="mood" style="display:block;margin-top:12px">How was today?</label><select id="mood" style="font:inherit;padding:10px;border:1px solid #d7e1d0;border-radius:9px"><option>Steady</option><option>Grateful</option><option>Challenging</option><option>Hopeful</option><option>Tired</option></select><label for="note" style="display:block;margin-top:12px">A thought to keep</label><textarea id="note" placeholder="What mattered today?" required></textarea><button style="margin-top:10px">Save entry</button> <button type="button" id="export" style="background:#e7efe2;color:#2d422d">Export journal</button></form></section><section class="panel"><h2>Recent reflections</h2><div id="entries"><p class="muted">No entries yet.</p></div></section><p class="muted">Entries exist in this page session only. Export a backup before leaving.</p><script>let entries=[];const $=id=>document.getElementById(id);$("date").value=new Date().toISOString().slice(0,10);function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function draw(){$("entries").innerHTML=entries.length?[...entries].reverse().map(e=>'<article class="entry"><b>'+esc(e.date)+' · '+esc(e.mood)+'</b><p>'+esc(e.note).replace(/\n/g,"<br>")+'</p><button data-id="'+e.id+'" style="padding:6px 9px">Delete</button></article>').join(""):'<p class="muted">No entries yet.</p>';$("entries").querySelectorAll("button").forEach(b=>b.onclick=()=>{entries=entries.filter(e=>e.id!==b.dataset.id);draw()})}$("form").onsubmit=e=>{e.preventDefault();entries.push({id:crypto.randomUUID(),date:$("date").value,mood:$("mood").value,note:$("note").value});$("note").value="";draw()};$("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(entries,null,2)],{type:"application/json"}));a.download="journal-garden.json";a.click();URL.revokeObjectURL(a.href)};draw();</script></body></html>
