<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unitwise</title><style>body{font:16px system-ui;background:#f7f3ec;color:#30291f;margin:auto;max-width:760px;padding:24px}h1{font-size:42px;letter-spacing:-2px}.box{background:#fff;border:1px solid #e9dfd1;border-radius:18px;padding:22px}.tabs{display:flex;gap:7px;flex-wrap:wrap}button,select,input{font:inherit;padding:11px;border-radius:9px;border:1px solid #dfd4c4}button{cursor:pointer;background:#5c462a;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}input{width:100%;box-sizing:border-box}.result{background:#f4ede2;padding:18px;border-radius:12px;margin-top:15px}.muted{color:#84796a;font-size:13px}</style><body><p class="muted">EVERYDAY CALCULATIONS</p><h1>Unitwise</h1><p>Convert common measurements instantly, without an internet connection.</p><section class="box"><div class="tabs"><button data-type="length">Length</button><button data-type="weight">Weight</button><button data-type="temp">Temperature</button><button data-type="volume">Volume</button></div><label for="value">Value</label><input id="value" type="number" value="1" step="any"><div class="row"><div><label for="from">From</label><select id="from"></select></div><div><label for="to">To</label><select id="to"></select></div></div><div class="result"><div class="muted">RESULT</div><strong id="result" style="font-size:28px">—</strong></div><p class="muted">Uses fixed standard conversion factors. No currency conversion or live data.</p></section><script>const sets={length:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},weight:{kg:1,g:.001,mg:.000001,lb:.45359237,oz:.028349523125},volume:{L:1,mL:.001,"m³":1000,gal:3.785411784,cup:.2365882365},temp:{C:1,F:1,K:1}};let type="length";const $=id=>document.getElementById(id);function setup(t){type=t;$("from").innerHTML=$("to").innerHTML=Object.keys(sets[t]).map(u=>'<option>'+u+'</option>').join("");$("to").selectedIndex=1;calc()}function calc(){let v=+$("value").value,a=$("from").value,b=$("to").value,r;if(!Number.isFinite(v))r="Enter a valid number";else if(type==="temp"){let c=a==="C"?v:a==="F"?(v-32)*5/9:v-273.15;r=b==="C"?c:b==="F"?c*9/5+32:c+273.15}else r=v*sets[type][a]/sets[type][b];$("result").textContent=typeof r==="string"?r:new Intl.NumberFormat(undefined,{maximumFractionDigits:8}).format(r)+" "+b}document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>setup(b.dataset.type));["value","from","to"].forEach(id=>$(id).oninput=calc);setup("length");</script></body></html>
