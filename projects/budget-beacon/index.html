<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Beacon</title><style>body{font:16px system-ui;margin:0;background:#eef3f1;color:#1d302c}.app{max-width:760px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce6e1;border-radius:18px;padding:18px;margin:12px 0}label{display:block;font-size:13px;margin:8px 0 4px}input,select,button{font:inherit;padding:10px;border:1px solid #dce6e1;border-radius:10px;max-width:100%}button{cursor:pointer;background:#126a54;color:white}ul{padding-left:20px}li{margin:8px 0}strong{font-size:1.4rem}@media(max-width:500px){.app{padding:12px}}</style></head><body><main class="app"><h1>Budget Beacon</h1><p>Track your money manually. Entries stay in this browser.</p><section class="card"><form id="form"><label for="desc">Description</label><input id="desc" required maxlength="80"><label for="amount">Amount (INR)</label><input id="amount" type="number" min=".01" step=".01" required><label for="kind">Type</label><select id="kind"><option value="expense">Expense</option><option value="income">Income</option></select><button>Add entry</button></form></section><section class="card"><h2>Balance</h2><strong id="balance">₹0.00</strong><ul id="list"></ul><p id="status" role="status"></p></section></main><script>const key="budget-beacon-v1";let items=[];try{items=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}const $=x=>document.getElementById(x);function render(){let sum=0;const list=$("list");list.replaceChildren();items.forEach((x,i)=>{sum+=x.kind==="income"?x.amount:-x.amount;const li=document.createElement("li");li.textContent=x.desc+" — "+(x.kind==="income"?"+":"−")+"₹"+x.amount.toFixed(2)+" ";const b=document.createElement("button");b.textContent="Delete";b.onclick=()=>{items.splice(i,1);save();render()};li.append(b);list.append(li)});$("balance").textContent="₹"+sum.toFixed(2)}function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){$("status").textContent="Storage unavailable; data may not persist."}}$("form").onsubmit=e=>{e.preventDefault();items.push({desc:$("desc").value.trim(),amount:Number($("amount").value),kind:$("kind").value});save();e.target.reset();render();$("status").textContent="Entry added."};render();</script></body></html>
