<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SplitFair — Shared expense calculator</title><style>
body{margin:0;background:#f6f4ed;color:#202d2a;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px}header{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:44px;height:44px;border-radius:14px;background:#226b53;color:white;display:grid;place-items:center;font-size:22px}h1{margin:0;font-size:25px;letter-spacing:-.04em}p{margin:3px 0;color:#727b75}.hero,.panel,.stat{background:#fffefa;border:1px solid #e5e7df;border-radius:17px;padding:17px;margin-bottom:13px}.hero{background:linear-gradient(120deg,#dcefe3,#f8f0dd)}h2{margin:0;font-size:30px;letter-spacing:-.05em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat strong{display:block;font-size:22px}.stat small{color:#727b75}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}h3{margin:0 0 12px;font-size:17px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:700}input,select,button{font:inherit}input,select{padding:10px;border:1px solid #e5e7df;border-radius:10px;width:100%;box-sizing:border-box}.primary{background:#226b53;color:white;border:0;border-radius:10px;padding:11px;font-weight:800;width:100%;cursor:pointer}.ghost{background:white;border:1px solid #e5e7df;border-radius:9px;padding:8px 10px;cursor:pointer}.entry{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e5e7df}.entry small{display:block;color:#727b75}.empty{padding:20px;text-align:center;color:#727b75;border:1px dashed #e5e7df;border-radius:12px}.status{font-size:12px;color:#226b53;min-height:20px}@media(max-width:650px){.wrap{padding:14px 10px}.layout{grid-template-columns:1fr}.hero,.panel,.stat{padding:13px}.stats{gap:6px}.stat strong{font-size:18px}h2{font-size:25px}}
</style></head><body><main class="wrap"><header><div class="logo">÷</div><div><h1>SplitFair</h1><p>Shared costs, clearly divided.</p></div></header><section class="hero"><h2>Make group expenses easier.</h2><p>Add people and expenses, then view a simple settlement suggestion.</p></section><section class="stats"><div class="stat"><small>Total expenses</small><strong id="total">₹0</strong></div><div class="stat"><small>People</small><strong id="count">0</strong></div><div class="stat"><small>Entries</small><strong id="entries">0</strong></div></section><div class="layout"><section class="panel"><h3>People</h3><form id="pf"><div class="field"><label for="person">Name</label><input id="person" maxlength="35" required placeholder="Add a person"></div><button class="primary">Add person</button></form><div id="people"></div><hr style="border:0;border-top:1px solid #e5e7df;margin:16px 0"><h3>New expense</h3><form id="ef"><div class="field"><label for="desc">Description</label><input id="desc" maxlength="80" required placeholder="Dinner, taxi…"></div><div class="field"><label for="amount">Amount</label><input id="amount" type="number" min=".01" step=".01" required></div><div class="field"><label for="payer">Paid by</label><select id="payer" required></select></div><button class="primary">Add expense</button></form><div class="status" id="status" role="status"></div></section><section class="panel"><h3>Expense history</h3><div id="expenses"></div><h3 style="margin-top:20px">Suggested settlements</h3><div id="settlements"></div><button class="ghost" id="export">Export CSV</button> <button class="ghost" id="clear">Clear all</button><p style="font-size:11px">Equal-split calculator only. Verify results with your group.</p></section></div></main><script>
const $=id=>document.getElementById(id),KEY='splitfair-v1';let people=[],expenses=[];function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function money(n){return '₹'+Number(n).toFixed(2)}function save(){try{localStorage.setItem(KEY,JSON.stringify({people,expenses}))}catch(e){$('status').textContent='Storage unavailable; export your data.'}}function id(){return String(Date.now())+Math.random()}function render(){$('count').textContent=people.length;$('entries').textContent=expenses.length;$('total').textContent=money(expenses.reduce((s,x)=>s+x.amount,0));$('people').innerHTML=people.map(p=>'<div class="entry"><strong>'+esc(p.name)+'</strong><button class="ghost" data-rm="'+p.id+'">Remove</button></div>').join('')||'<div class="empty">Add group members first.</div>';$('payer').innerHTML='<option value="">Choose payer</option>'+people.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');$('expenses').innerHTML=expenses.length?expenses.slice().reverse().map(x=>'<div class="entry"><div><strong>'+esc(x.desc)+'</strong><small>Paid by '+esc(people.find(p=>p.id===x.payer)?.name||'Removed member')+'</small></div><div><strong>'+money(x.amount)+'</strong><br><button class="ghost" data-re="'+x.id+'">Remove</button></div></div>').join(''):'<div class="empty">No expenses yet.</div>';let bal=new Map(people.map(p=>[p.id,0]));expenses.forEach(x=>{if(bal.has(x.payer))bal.set(x.payer,bal.get(x.payer)+x.amount);const share=x.amount/Math.max(1,people.length);people.forEach(p=>bal.set(p.id,(bal.get(p.id)||0)-share))});let debt=[],credit=[];bal.forEach((v,k)=>{if(v<-.01)debt.push({id:k,v:-v});if(v>.01)credit.push({id:k,v})});let out=[],i=0,j=0;while(i<debt.length&&j<credit.length){let n=Math.min(debt[i].v,credit[j].v);out.push('<div class="entry">'+esc(people.find(p=>p.id===debt[i].id)?.name||'Someone')+' → '+esc(people.find(p=>p.id===credit[j].id)?.name||'someone')+' <strong>'+money(n)+'</strong></div>');debt[i].v-=n;credit[j].v-=n;if(debt[i].v<.01)i++;if(credit[j].v<.01)j++}$('settlements').innerHTML=people.length<2?'<div class="empty">Add at least two people.</div>':out.join('')||'<div class="empty">All settled.</div>'} $('pf').addEventListener('submit',e=>{e.preventDefault();const name=$('person').value.trim();if(!name)return;if(people.some(p=>p.name.toLowerCase()===name.toLowerCase())){$('status').textContent='That name already exists.';return}people.push({id:id(),name});$('person').value='';save();render()});$('ef').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value),payer=$('payer').value;if(!payer||!Number.isFinite(amount)||amount<=0){$('status').textContent='Choose a payer and positive amount.';return}expenses.push({id:id(),desc:$('desc').value.trim(),amount,payer});e.target.reset();save();render()});document.addEventListener('click',e=>{const r=e.target.closest('[data-rm]'),x=e.target.closest('[data-re]');if(r){people=people.filter(p=>p.id!==r.dataset.rm);save();render()}if(x){expenses=expenses.filter(p=>p.id!==x.dataset.re);save();render()}});$('export').addEventListener('click',()=>{const csv='Description,Amount,Payer\n'+expenses.map(x=>'"'+x.desc.replace(/"/g,'""')+'",'+x.amount+',"'+(people.find(p=>p.id===x.payer)?.name||'')+'"').join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='splitfair.csv';a.click();URL.revokeObjectURL(a.href)});$('clear').addEventListener('click',()=>{if(confirm('Clear all group data?')){people=[];expenses=[];save();render()}});try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');people=Array.isArray(d.people)?d.people:[];expenses=Array.isArray(d.expenses)?d.expenses:[]}catch(e){}render();
</script></body></html>
